name: qltv-demo

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:${SQL_PORT:-14330}:1433"
    volumes:
      - qltv_sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      QLTV_MANAGER_PASSWORD: ${QLTV_MANAGER_PASSWORD:?Set QLTV_MANAGER_PASSWORD in .env}
      QLTV_STAFF_PASSWORD: ${QLTV_STAFF_PASSWORD:?Set QLTV_STAFF_PASSWORD in .env}
    volumes:
      - ./docker/init-db.sh:/setup/init-db.sh:ro
      - "./beta_testing_files/QLTV_11_tables (1).sql:/setup/00_schema.sql:ro"
      - ./docker/sql/01_seed_employees.sql:/setup/01_seed_employees.sql:ro
      - ./sql/01_security_setup.sql:/setup/02_security_setup.sql:ro
      - ./docker/sql/03_create_accounts.sql:/setup/03_create_accounts.sql:ro
      - ./docker/sql/04_mark_initialized.sql:/setup/04_mark_initialized.sql:ro
    entrypoint: ["/bin/bash", "/setup/init-db.sh"]
    restart: "no"

volumes:
  qltv_sql_data:

